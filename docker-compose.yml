services:
  db:
    # Pinned, not floating `mysql:8` — a silent minor-version bump mid-deploy triggers MySQL's
    # data-dictionary upgrade routine on container recreate, which is memory-hungry at exactly
    # the moment migrations also spin up node processes; on a small host that's an OOM risk.
    # NOTE: `mysql:8` currently tracks the 8.4.x LTS line on Docker Hub, not 8.0.x — confirmed
    # 2026-08-15 when pinning to 8.0.46 caused "Invalid MySQL server downgrade: Cannot downgrade
    # from 80411 to 80046" on prod's existing data dir (MySQL refuses any downgrade, even across
    # otherwise-compatible major versions). 8.4.11 matches what was already running. Bump
    # deliberately from here — before ever bumping again, run `docker compose exec db mysql
    # --version` first and pin to that version or newer; never pin backwards.
    image: mysql:8.4.11
    restart: unless-stopped
    # performance_schema alone costs ~300-400MB RSS on stock config — not worth it on a small
    # host. The rest keeps the buffer pool/connection/cache footprint bounded rather than
    # scaling to host RAM, appropriate for this dataset's size (~600 provinces).
    command: >
      --performance-schema=OFF
      --innodb-buffer-pool-size=256M
      --max-connections=50
      --table-open-cache=200
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER_NAME}
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER_NAME: ${DB_USER_NAME}
      DB_USER_PASSWORD: ${DB_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: web-map/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  db_data:
